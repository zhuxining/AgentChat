[package]
name = "agentchat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "agentchat"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true # 启用链接时优化。
opt-level = 3 # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort" # 通过禁用 panic 处理程序来提高性能。
strip = true # 确保移除调试符号。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Tauri Core ──────────────────────────────────────────────────────
# Tauri 的版本检查要求 Rust crate 与对应的 @tauri-apps/* JS 包处于同一 major.minor。
# 这里用 ~ 固定到 JS 包当前的 minor（见 package.json），避免 cargo update 升到
# 更高 minor 后打包因版本不匹配失败。升级时两侧必须同步。
tauri = { version = "~2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "~2.7"
tauri-plugin-clipboard-manager = "~2.5"
tauri-plugin-dialog = "~2.8"
tauri-plugin-fs = "~2.7"
tauri-plugin-notification = "~2.7"
tauri-plugin-os = "~2.4"
tauri-plugin-persisted-scope = "~2.4"
tauri-plugin-process = "~2.4"
tauri-plugin-sql = { version = "~2.6", features = ["sqlite"] }
tauri-plugin-websocket = "~2.5"

# ── Tauri Desktop-Only ──────────────────────────────────────────────
# Plugins not available on mobile (Android/iOS)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "=0.13.3", default-features = false, features = [
  "blocking",
  "rustls",
  "system-proxy",
] }
sha2 = "=0.10.9"
tauri-plugin-autostart = "~2.7"
tauri-plugin-cli = "~2.5"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-updater = "~2.14"
tauri-plugin-window-state = "~2.5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
tokio = { version = "1.52.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = [
  "linux-native-sync-persistent",
  "crypto-rust",
  "vendored",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"
